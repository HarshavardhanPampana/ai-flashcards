name: update-flashcards

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); odd minute avoids peak queueing
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write             # allow the job to push commits

concurrency:
  group: update-flashcards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MAX_CARDS_PER_RUN: "40"
        run: python -u -m scraper.main   # -u: show log lines live

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cards.json data/seen.json
          git diff --staged --quiet || git commit -m "chore: update flashcards"
          git pull --rebase
          git push
