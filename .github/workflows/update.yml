name: update-flashcards

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC); odd minute avoids peak queueing
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write             # allow the job to push commits
  actions: write              # allow the keep-alive step below to re-enable the scheduled workflows

concurrency:
  group: update-flashcards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache encoder model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-minilm-v1

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          MAX_CARDS_PER_RUN: "40"
        run: python -u -m scraper.main   # -u: show log lines live

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/cards.json docs/embeddings.json docs/stats.json data/seen.json data/compare_inputs.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "chore: update flashcards"
          git pull --rebase
          git push

      # GitHub switches off scheduled workflows in public repos after 60 days without repo activity.
      # Re-enabling them through the API resets that timer, so the site keeps updating on its own.
      - name: Keep scheduled workflows alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in update.yml images.yml compare.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
