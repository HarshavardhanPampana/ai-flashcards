name: compare-models

# Weekly (and on demand): summarize a few recent stories with a small local decoder
# (Qwen2.5-0.5B on CPU) and compare with the big API model's cards.
on:
  schedule:
    - cron: "40 3 * * 1"         # Mondays 03:40 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many stories to compare"
        default: "5"

permissions:
  contents: write

concurrency:
  group: update-flashcards
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch (CPU), transformers and the encoder
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-gen.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/fastembed
          key: hf-qwen05-minilm-v1

      - name: Compare models
        env:
          COMPARE_N: ${{ github.event.inputs.count || '5' }}
        run: python -u -m gen.compare

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/compare.json ]; then git add docs/compare.json; fi
          git diff --staged --quiet || git commit -m "chore: update model comparison"
          git pull --rebase
          git push
